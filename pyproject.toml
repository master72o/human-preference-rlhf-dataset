[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "human-preference-rlhf-dataset"
version = "1.0.0"
description = "An original human-preference annotation framework and dataset analysis toolkit for RLHF alignment."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "RLHF Specialist & Data Quality Engineer", email = "rlhf@example.com" }
]
dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.5.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.0.0",
    "statsmodels>=0.13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
preference-analyzer = "dataset.cli:main"

[tool.setuptools.packages.find]
include = ["dataset*"]
